<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusBugs - Create an issue</title>
    <script>document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "light");</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar cb-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand cb-brand" href="index.html">🐞 Campus<span>Bugs</span></a>
        <div class="d-flex align-items-center gap-2">
            <button id="themeBtn" class="btn btn-sm btn-outline-secondary rounded-pill">🌙</button>
            <button id="logoutBtn" class="btn btn-sm btn-outline-secondary rounded-pill px-3">Log out</button>
        </div>
    </div>
</nav>

<main class="container page py-4">
    <h4 class="fw-bold mb-3">Create an issue</h4>

    <form id="createForm" class="panel">
        <div id="formError" class="alert alert-danger d-none"></div>

        <label class="form-label fw-semibold" for="category">Category</label>
        <select id="category" class="form-select mb-3"></select>

        <label class="form-label fw-semibold" for="title">Title</label>
        <input id="title" class="form-control" maxlength="100" placeholder="What is the problem?">
        <div class="counter mb-3"><span id="titleCount">0</span>/100</div>

        <label class="form-label fw-semibold" for="description">Details</label>
        <textarea id="description" class="form-control" rows="6" maxlength="1000"
                  placeholder="What is happening, where, and how often?"></textarea>
        <div class="counter mb-3"><span id="descCount">0</span>/1000</div>

        <div class="alert alert-secondary small">
            🔒 Your post is anonymous. Focus on the problem, not on people. You can post up to 3 issues in 24 hours.
        </div>

        <div class="d-flex justify-content-end gap-2">
            <a href="index.html" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
            <button id="postBtn" class="btn btn-brand px-4" disabled>Post</button>
        </div>
    </form>
</main>

<script src="js/api.js"></script>
<script src="js/create.js"></script>
</body>
</html>
