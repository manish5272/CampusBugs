<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusBugs</title>
    <script>document.documentElement.setAttribute("data-bs-theme", localStorage.getItem("theme") || "light");</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar cb-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand cb-brand" href="index.html">🐞 Campus<span>Bugs</span></a>
        <div class="d-flex align-items-center gap-2">
            <a href="create.html" class="btn btn-brand btn-sm px-3">＋ Create</a>
            <button id="themeBtn" class="btn btn-sm btn-outline-secondary rounded-pill">🌙</button>
            <button id="logoutBtn" class="btn btn-sm btn-outline-secondary rounded-pill px-3">Log out</button>
        </div>
    </div>
</nav>

<main class="container page py-4">
    <div id="categoryPills" class="pill-row mb-3"></div>

    <div id="issueList"></div>

    <div id="emptyMessage" class="empty-state d-none">
        <div class="display-4">🎉</div>
        <h5 class="mt-2">No issues here yet</h5>
        <p>Be the first to report one.</p>
        <a href="create.html" class="btn btn-brand px-4">Create an issue</a>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/feed.js"></script>
</body>
</html>
